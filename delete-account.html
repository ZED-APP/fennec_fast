<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Language Switch Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-xl rounded-2xl p-6 max-w-md w-full">

    <!-- Language Buttons -->
    <div class="flex gap-4 mb-6">
      <button id="btn-en" class="flex items-center gap-2 px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" onclick="setLang('en')">
        <span>EN</span>
        <img id="img-en" src="en.png" class="w-5 h-5 hidden">
      </button>

      <button id="btn-ar" class="flex items-center gap-2 px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" onclick="setLang('ar')">
        <span>AR</span>
        <img id="img-ar" src="ar.png" class="w-5 h-5 hidden">
      </button>
    </div>

    <!-- English Content -->
    <div id="content-en">
      <h2 class="text-xl font-bold mb-2">Hello!</h2>
      <p>This is English content. Switch to Arabic to see the other version.</p>
    </div>

    <!-- Arabic Content -->
    <div id="content-ar" class="hidden text-right" dir="rtl">
      <h2 class="text-xl font-bold mb-2">مرحبا!</h2>
      <p>هذا هو المحتوى باللغة العربية. اضغط على EN للعودة للغة الإنجليزية.</p>
    </div>

  </div>

  <script>
    function setLang(lang) {
      // Show content
      document.getElementById("content-en").classList.add("hidden");
      document.getElementById("content-ar").classList.add("hidden");
      document.getElementById("content-" + lang).classList.remove("hidden");

      // Show image only for selected button
      document.getElementById("img-en").classList.add("hidden");
      document.getElementById("img-ar").classList.add("hidden");
      document.getElementById("img-" + lang).classList.remove("hidden");
    }

    // Set default
    setLang("en");
  </script>

</body>
</html>
